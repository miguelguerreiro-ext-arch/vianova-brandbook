<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table cell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<style>
html, body { margin: 0; background: var(--surface-page, #ffffff); }

</style>
</head>
<body>
<div class="vn-scope vn-stage">
<div class="vn-table vn-regular">
  <div class="vn-tr vn-head" style="grid-template-columns: 150pt 110pt minmax(0, 1fr)"><div class="vn-td">Column</div><div class="vn-td">Column</div><div class="vn-td">Column</div></div>
  <div class="vn-tr" style="grid-template-columns: 150pt 110pt minmax(0, 1fr)"><div class="vn-td vn-lead">Label</div><div class="vn-td"><span class="vn-pill vn-existing">Existing</span></div><div class="vn-td">Value in the body style, one line where it can be.</div></div>
  <div class="vn-tr" style="grid-template-columns: 150pt 110pt minmax(0, 1fr)"><div class="vn-td vn-lead">Label</div><div class="vn-td"><span class="vn-pill">Included</span></div><div class="vn-td">Value</div></div>
  <div class="vn-tr" style="grid-template-columns: 150pt 110pt minmax(0, 1fr)"><div class="vn-td vn-lead">Label</div><div class="vn-td"><span class="vn-pill vn-proposed">Proposed</span></div><div class="vn-td">Value</div></div>
</div>
</div>
</body>
</html>
