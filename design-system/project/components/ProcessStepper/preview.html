<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process stepper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<style>
html, body { margin: 0; background: var(--surface-page, #ffffff); }

</style>
</head>
<body>
<div class="vn-scope vn-stage">
<div class="vn-steps">
  <div class="vn-step"><div class="vn-n">1</div><div class="vn-t">Write the text</div></div>
  <div class="vn-step"><div class="vn-n">2</div><div class="vn-t">Mark full-measure blocks</div></div>
  <div class="vn-step"><div class="vn-n">3</div><div class="vn-t">Build</div></div>
  <div class="vn-step"><div class="vn-n">4</div><div class="vn-t">Measure the pages</div></div>
  <div class="vn-step"><div class="vn-n">5</div><div class="vn-t">Check against the source</div></div>
  <div class="vn-step vn-caveat"><div class="vn-n">6</div><div class="vn-t">Review on the canvas</div></div>
  <div class="vn-step"><div class="vn-n">7</div><div class="vn-t">Export the PDF</div></div>
</div>
</div>
</body>
</html>
