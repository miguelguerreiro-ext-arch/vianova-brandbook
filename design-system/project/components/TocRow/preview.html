<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TOC row</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<style>
html, body { margin: 0; background: var(--surface-page, #ffffff); }

</style>
</head>
<body>
<div class="vn-scope vn-stage">
<div class="vn-toc">
  <div class="vn-toc-row"><span class="vn-tn">1</span><span class="vn-tt">Section title goes here</span><span class="vn-tp">3</span></div>
  <div class="vn-toc-row vn-toc-sub"><span class="vn-tn">1.1</span><span class="vn-tt">Subsection title</span><span class="vn-tp">3</span></div>
  <div class="vn-toc-row vn-toc-sub"><span class="vn-tn">1.2</span><span class="vn-tt">Subsection title</span><span class="vn-tp">4</span></div>
  <div class="vn-toc-row"><span class="vn-tn">2</span><span class="vn-tt">Section title goes here</span><span class="vn-tp">6</span></div>
  <div class="vn-toc-row vn-toc-sub"><span class="vn-tn">2.1</span><span class="vn-tt">Subsection title</span><span class="vn-tp">6</span></div>
</div>
</div>
</body>
</html>
