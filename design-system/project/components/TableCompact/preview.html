<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<style>
html, body { margin: 0; background: var(--surface-page, #ffffff); }

</style>
</head>
<body>
<div class="vn-scope vn-stage">
<div class="vn-table">
  <div class="vn-tr vn-head" style="grid-template-columns: 150pt minmax(0, 1fr)"><div class="vn-td">Required</div><div class="vn-td vn-plus">Offered in addition</div></div>
  <div class="vn-tr" style="grid-template-columns: 150pt minmax(0, 1fr)"><div class="vn-td">Report as a PDF</div><div class="vn-td"><strong>An accessible PDF and the source data</strong> as open files</div></div>
  <div class="vn-tr" style="grid-template-columns: 150pt minmax(0, 1fr)"><div class="vn-td">Two review rounds</div><div class="vn-td"><strong>Three rounds</strong>, the last one on site</div></div>
  <div class="vn-tr" style="grid-template-columns: 150pt minmax(0, 1fr)"><div class="vn-td">Handover meeting</div><div class="vn-td"><strong>Handover and a recorded walkthrough</strong> for staff who join later</div></div>
</div>
</div>
</body>
</html>
