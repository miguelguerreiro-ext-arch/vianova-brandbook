name: capture-staleness
on:
  schedule: [{ cron: "0 7 * * 1" }]   # Mondays 07:00 UTC
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: check
        continue-on-error: true
        env: { FIGMA_TOKEN: "${{ secrets.FIGMA_TOKEN }}" }
        run: pnpm capture:check
      - if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "Figma moved — re-capture needed",
              body: "`capture:check` reports the Figma library has changed since `capture/lock.json`.\n\nRe-capture through the Figma MCP and commit `capture/`."
            })
